[project]
name = "clase-0-introduccion-a-los-llms"
version = "0.0.1"
description = "Proyecto como Introduccion a los LLMs"
requires-python = ">=3.11"
authors = [
    { name = "Emanuel Cortez", email = "emanuelcortez32@gmail.com" }
]

dependencies = [
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "scikit-learn==1.8.0",
    "gensim==4.4.0",
    "seaborn==0.13.2",
    "huggingface-hub==2.2.0",
    "ipywidgets==8.1.8",
    "fsspec==2025.12.0",
    "ipykernel==7.1.0",
    "transformers==5.19.0",
    "torch>=2.0.0"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["."]


[tool.hatch.build.targets.wheel]
packages = ["."]