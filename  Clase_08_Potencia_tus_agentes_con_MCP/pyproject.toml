[project]
name = "rioja-tour-agent"
version = "0.0.1"
description = "AI Agent API with FastAPI and LangChain for La Rioja Tours"
#readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Emanuel Cortez" }
]
dependencies = [
    "fastapi[standard]==0.128.0",
    "langchain==1.2.10",
    "langchain-core==1.3.2",
    "langchain-community==0.3.31",
    "langchain-openrouter==0.2.3",
    "langchain-mcp-adapters==0.2.2",
    "langgraph==1.0.8",
    "langgraph-prebuilt==1.0.7",
    "langgraph-checkpoint-redis==0.4.1",
    "pydantic==2.12.5",
    "pydantic-settings>=2.10.1",
    "python-dotenv==1.2.2",
    "uuid7==0.1.0",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "termcolor==3.3.0",
    "PyJWT==2.13.0",
    "redis==7.4.1",
    "redisvl==0.20.1"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest_env]